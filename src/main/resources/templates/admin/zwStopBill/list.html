<!-- 提单层：只有三要素三个输入格，没有落名数、没有关口之类可代填的格子 -->
<script type="text/html" id="stop-bill-submit-form">
    <form class="layui-form" style="padding: 20px 10px 0 0" id="stop-bill-submit-layui-form">
        <div class="layui-form-item">
            <label class="layui-form-label">水源点代号</label>
            <div class="layui-input-block">
                <input type="text" name="siteNo" required lay-verify="required" placeholder="底档代号，如 ZS00" class="layui-input">
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">停水事由</label>
            <div class="layui-input-block">
                <select name="stopReason" lay-verify="required">
                    <option value="">请选择</option>
                    <option value="DEPLETION">水源枯竭</option>
                    <option value="EXCEED">指标连续超标</option>
                    <option value="REPAIR">检修</option>
                </select>
            </div>
        </div>
        <div class="layui-form-item">
            <label class="layui-form-label">替代供水方案</label>
            <div class="layui-input-block">
                <textarea name="altPlan" required lay-verify="required" placeholder="停水后怎么供水，三要素之一" class="layui-textarea"></textarea>
            </div>
        </div>
        <div class="layui-form-item">
            <div class="layui-input-block">
                <button class="pear-btn pear-btn-primary" lay-submit lay-filter="stop-bill-submit-ok">提交申请</button>
            </div>
        </div>
    </form>
</script>

<th:block th:include="include :: footer"/>
<script>
    layui.use(['table', 'form', 'jquery', 'layer'], function () {
        let table = layui.table;
        let form = layui.form;
        let $ = layui.jquery;
        let layer = layui.layer;

        let MODULE_PATH = rootPath + "/zwStopBill/";
        let cols = [
            [
                {title: 'ID', field: 'id', align: 'center', hide: true},
                {title: '签核单号', field: 'billNo', align: 'center', width: 190},
                {title: '水源点代号', field: 'siteNo', align: 'center', width: 110},
                {title: '停水事由', field: 'stopReason', align: 'center', width: 120, templet: '#stop-bill-reason'},
                {title: '当年序', field: 'yearSeq', align: 'center', width: 80},
                {title: '走到哪一关', field: 'nodeNo', align: 'center', width: 120, templet: '#stop-bill-node'},
                {title: '轮次', field: 'roundNo', align: 'center', width: 70},
                {title: '情形', field: 'status', align: 'center', width: 90, templet: '#stop-bill-status'},
                {title: '批准时刻', field: 'approvedTime', align: 'center', width: 170},
                {title: '替代供水方案', field: 'altPlan', align: 'center', minWidth: 200},
                {title: '操作', toolbar: '#stop-bill-bar', align: 'center', width: 190, fixed: 'right'}
            ]
        ];

        table.render({
            elem: '#stop-bill-table',
            url: MODULE_PATH + 'list',
            page: true,
            method: 'get',
            cols: cols,
            skin: 'line',
            toolbar: '#stop-bill-toolbar',
            defaultToolbar: ['filter', 'print', 'exports']
        });

        function ask(promptTitle, fieldBuilder) {
            layer.prompt({title: promptTitle, formType: 2}, function (text, idx) {
                $.ajax({
                    url: MODULE_PATH + fieldBuilder.action,
                    type: 'post',
                    data: fieldBuilder.data(text),
                    success: function (res) {
                        handleResult(res, idx);
                    }
                });
            });
        }

        // 服务层结局分四种亮：200 过口；202 压在本关；error 未受理/终止锁死
        function handleResult(res, idx) {
            if (res.code === 200) {
                layer.close(idx);
                let r = res.data || {};
                layer.msg(r.message || '已落账', {icon: 1});
                table.reload('stop-bill-table');
            } else if (res.code === 202) {
                // 压住不等于失败：单还在核，提示后可再办
                layer.msg((res.data && res.data.message) || res.msg || '前置未齐，压在本关', {icon: 0});
            } else {
                layer.msg(res.msg || '操作未生效', {icon: 2});
            }
        }

        table.on('toolbar(stop-bill-table)', function (obj) {
            if (obj.event === 'submit') {
                layer.open({
                    type: 1,
                    title: '业务科提单（三要素缺一当场挡回）',
                    area: ['560px', '430px'],
                    content: $('#stop-bill-submit-form').html(),
                    success: function () {
                        // 弹窗 select 必须重新渲染 layui 样式；页内表单一并重渲染无妨
                        form.render();
                    }
                });
            }
        });

        form.on('submit(stop-bill-submit-ok)', function (data) {
            $.ajax({
                url: MODULE_PATH + 'submit',
                type: 'post',
                data: data.field,
                success: function (res) {
                    if (res.code === 200) {
                        layer.closeAll();
                        let r = res.data || {};
                        layer.alert(r.message || '提单已受理', {icon: 1}, function (i) {
                            layer.close(i);
                            table.reload('stop-bill-table');
                        });
                    } else {
                        layer.msg(res.msg || '提单被挡回', {icon: 2});
                    }
                }
            });
            return false;
        });

        table.on('tool(stop-bill-table)', function (obj) {
            let d = obj.data;
            if (obj.event === 'detail') {
                location.href = MODULE_PATH + 'detail?id=' + d.id;
            } else if (obj.event === 'withdraw') {
                ask('撤回意见（撤回即终止锁死）', {
                    action: 'withdraw',
                    data: function (text) { return {id: d.id, opinion: text}; }
                });
            }
        });

        form.on('submit(stop-bill-query)', function (data) {
            table.reload('stop-bill-table', {where: data.field, page: {curr: 1}});
            return false;
        });
    });
</script>
</html>
